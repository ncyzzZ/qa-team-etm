<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA AI Team</title>
<style>
  :root { --bg:#0B1022; --ink:#0B1022; --accent:#FFD23F; --main:#F25C9C; --mint:#9BE3B5; --alert:#FF8A80; --neon:#4FD8FF; --panel:#141B38; --edge:#3A4580; --soft:#C8D3F0; --inset:#0F1530; --deep:#070B1A; --strong:#fff; }
  * { box-sizing:border-box; }
  html { overflow-y:scroll; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--soft);
    font-family: ui-monospace, "Cascadia Mono", Consolas, "Noto Sans Thai", "Leelawadee UI", monospace; }
  header { padding:14px 12px 10px; display:flex; align-items:center; justify-content:flex-start; gap:20px; flex-wrap:wrap; }
  .tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .tools .zbtn { margin:0; }
  h1 { margin:0; font-size:34px; letter-spacing:.14em; color:var(--neon); text-shadow:0 0 6px var(--neon), 0 0 18px rgba(79,216,255,.6), 3px 3px 0 #08334a; }
  .meta { display:flex; gap:22px; font-size:16px; margin-left:auto; } .meta b { color:var(--accent); }
  @keyframes blink { 50% { opacity:.25; } }
  main { padding:0 12px 24px; display:grid; grid-template-columns:260px minmax(0,1fr) 400px; gap:12px; align-items:start; }
  @media (max-width:1100px) { main { grid-template-columns:1fr 1fr; } #stagewrap { grid-column:1 / -1; order:-1; } }
  @media (max-width:640px) { main { grid-template-columns:1fr; } }
  .mid { display:flex; flex-direction:column; gap:12px; min-width:0; }
  #linkp { padding:8px 10px 10px; } #linkp h2 { margin-bottom:6px; font-size:13px; }
  #links { display:flex; flex-direction:column; gap:8px; }
  #links ul { list-style:none; margin:0; padding:6px; display:flex; flex-direction:column; gap:6px; }
  #links details { border:2px solid var(--edge); }
  #links summary { cursor:pointer; padding:5px 8px; font-size:12px; letter-spacing:.08em; color:var(--neon); list-style:none; display:flex; justify-content:space-between; user-select:none; }
  #links summary::-webkit-details-marker { display:none; } #links summary::before { content:'▾'; margin-right:6px; } #links details:not([open]) summary::before { content:'▸'; }
  #links summary b { margin-left:auto; color:var(--soft); }
  #links a { display:block; padding:6px 8px; background:var(--inset); border:2px solid var(--edge); border-left:5px solid var(--neon); color:var(--soft); text-decoration:none; font-size:12px; line-height:1.35; word-break:break-word; }
  #links a:hover { border-color:var(--neon); color:var(--strong); } #links a.report { border-left-color:var(--accent); } #links a.tc { border-left-color:var(--mint); } #links a.defect { border-left-color:var(--alert); }
  #links .none { font-size:11px; opacity:.6; padding:2px; }
  .left, .right { display:flex; flex-direction:column; gap:20px; min-width:0; }
  .left { gap:12px; }


  /* ---- pixel office (canvas + html labels) ---- */
  #stagewrap { justify-self:start; align-self:start; width:fit-content; max-width:100%; background:var(--deep); border:4px solid var(--edge); box-shadow:8px 8px 0 rgba(0,0,0,.45); display:flex; justify-content:center; padding:0; overflow:hidden; }
  #stage { position:relative; flex:none; }
  #cv { display:block; image-rendering:pixelated; image-rendering:crisp-edges; image-rendering:pixelated; }
  .lbl { position:absolute; transform:translate(-50%,0); font-weight:700; letter-spacing:.08em; color:#fff; text-shadow:1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; white-space:nowrap; pointer-events:none; }
  .lbl { pointer-events:auto !important; cursor:text; }
  .lblL { transform:translate(-100%,0); } .lblR { transform:translate(0,0); }   /* side seats: the name stands outside the chair */
  .nin { width:92px; background:var(--inset); color:var(--strong); border:2px solid var(--neon); font:inherit; text-align:center; padding:0 2px; outline:none; }
  #roster .who b { cursor:text; }
  .zbtn { background:var(--panel); color:var(--soft); border:3px solid var(--edge); font:inherit; font-size:13px; padding:4px 12px; cursor:pointer; margin-right:auto; margin-left:16px; }
  .szl { display:flex; align-items:center; gap:6px; margin-left:0; } .szl input { width:110px; accent-color:var(--neon); } .szl b { min-width:3.2em; color:var(--strong); }
  .thl { display:flex; align-items:center; gap:6px; margin-left:0; } .thl select { font:inherit; font-size:13px; color:var(--strong); background:var(--inset); border:2px solid var(--edge); padding:2px 6px; cursor:pointer; }
  .zbtn:hover { border-color:var(--neon); color:var(--strong); }
  .bub { position:absolute; transform:translate(-50%,-100%); max-width:170px; min-width:24px; padding:3px 7px; background:#fff; color:var(--ink); border:3px solid var(--ink); font-weight:700; line-height:1.25; text-align:center; white-space:nowrap; overflow:hidden; pointer-events:none; }
  .bub span { display:inline-block; }
  .bub.scroll { text-align:left; } .bub.scroll span { animation:marq var(--dur,6s) linear infinite; }
  @keyframes marq { 0%,12% { transform:translateX(0); } 88%,100% { transform:translateX(calc(-1 * var(--dist,0px))); } }
  .bub.working { border-color:var(--accent); } .bub.waiting { border-color:var(--main); } .bub.done { border-color:var(--mint); } .bub.blocked { border-color:var(--alert); background:#FFE3E0; } .bub.idle { background:rgba(255,255,255,.85); }
  .bub.hide { display:none; }
  #wallcard { position:absolute; transform:translate(-50%,-50%); background:#FFF8E1; color:#1B1B3A; border:4px solid #8B5A33; box-shadow:0 0 0 3px #0E1430, 4px 4px 0 3px rgba(0,0,0,.4); padding:.2em .9em .3em; font-weight:700; letter-spacing:.06em; white-space:nowrap; pointer-events:none; text-align:center; line-height:1.1; }
  #wallcard small { display:block; font-size:.5em; letter-spacing:.2em; color:#6B4529; }
  #wallcard b { font-size:1em; color:#C2307A; }

  .panel { background:var(--panel); border:4px solid var(--edge); box-shadow:6px 6px 0 rgba(0,0,0,.45); padding:14px; }
  .panel h2 { margin:0 0 10px; font-size:15px; letter-spacing:.1em; color:var(--neon); text-align:center; }
  .panel h2 small { display:block; margin-top:3px; font-size:11px; color:var(--soft); letter-spacing:.04em; font-weight:400; }
  #usage { padding:10px 14px 12px; } #usage h2 { margin-bottom:8px; }
  .ur { margin-bottom:10px; } .urow { display:grid; grid-template-columns:1fr auto; column-gap:8px; align-items:baseline; font-size:12px; } .urow b { color:var(--strong); font-size:14px; grid-column:2; grid-row:1; } .urow .ul { grid-column:1; grid-row:1; color:var(--soft); } .urow .rs { grid-column:1 / -1; grid-row:2; font-size:10px; opacity:.7; }
  .ubar { height:8px; background:var(--inset); border:2px solid var(--edge); margin-top:4px; } .ubar i { display:block; height:100%; transition:width .6s; }
  .ur.lo i { background:#378ADD; } .ur.mid i { background:#F59E0B; } .ur.hi i { background:#E24B4A; } .ur.hi .urow b { color:#FF8A80; }
  .uwarn { font-size:12px; line-height:1.4; margin:2px 0 0; color:var(--alert); } .uwarn.mid { color:#F59E0B; } .unote { font-size:11px; opacity:.6; margin:4px 0 0; }
  #team { border-color:#7A4FD0; box-shadow:0 0 14px rgba(122,79,208,.45), 6px 6px 0 rgba(0,0,0,.45); }
  #team { padding:8px 10px 10px; } #team h2 { margin-bottom:6px; font-size:13px; }
  #roster { display:flex; flex-direction:column; gap:6px; }
  .mem { display:flex; align-items:center; gap:6px; padding:3px 6px; background:var(--inset); border:3px solid #2E7FA8; border-radius:6px; box-shadow:inset 0 0 8px rgba(79,216,255,.12); }
  .mem .av { width:22px; height:28px; flex:none; background:var(--inset); border-radius:4px; display:flex; align-items:flex-end; justify-content:center; overflow:hidden; }
  .mem .av canvas { width:14px; height:28px; image-rendering:pixelated; }
  .mem .who { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .mem .who b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--strong); font-size:11px; letter-spacing:.06em; }
  .mem .who em { display:none; font-style:normal; font-size:11px; color:var(--soft); opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pbar { display:none; height:5px; background:var(--inset); border:2px solid var(--edge); margin-top:4px; overflow:hidden; } .pbar i { display:block; height:100%; background:var(--accent); transition:width .6s; }
  .pbar.ind i { width:35%; animation:slide 1.3s linear infinite; } @keyframes slide { from { margin-left:-35%; } to { margin-left:100%; } }
  .pt { display:none; font-size:11px; color:var(--soft); margin-top:2px; font-variant-numeric:tabular-nums; }
  .mem.working .pbar { display:block; } .mem.working .pt { display:block; }
  .mem .st { margin-left:auto; white-space:nowrap; font-size:10px; font-weight:700; color:#8A93BD; }
  .mem .dot { width:8px; height:8px; border-radius:50%; background:#4A5280; flex:none; }
  .mem.working { border-color:#3DDC84; } .mem.working .st { color:#3DDC84; } .mem.working .dot { background:#3DDC84; box-shadow:0 0 8px #3DDC84; animation:blink 1s steps(2) infinite; }
  .mem.done { border-color:var(--mint); } .mem.done .st { color:var(--mint); } .mem.done .dot { background:var(--mint); }
  .mem.waiting { border-color:var(--main); } .mem.waiting .st { color:var(--main); } .mem.waiting .dot { background:var(--main); }
  .mem.blocked { border-color:var(--alert); } .mem.blocked .st { color:var(--alert); } .mem.blocked .dot { background:var(--alert); }
  #tok { padding:10px 14px 12px; } #tok h2 { margin-bottom:8px; font-size:15px; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  .tile { background:var(--inset); border:2px solid var(--edge); padding:3px 8px; display:flex; flex-direction:column; gap:0; }
  .tile span { font-size:9px; letter-spacing:.08em; color:var(--soft); opacity:.8; }
  .tile b { font-size:13px; color:var(--strong); font-variant-numeric:tabular-nums; }
  .tile.big { border-color:var(--neon); grid-column:span 2; } .tile.big b { font-size:17px; color:var(--neon); text-shadow:0 0 6px rgba(79,216,255,.5); }
  .split { display:flex; height:8px; margin-top:8px; background:var(--inset); border:2px solid var(--edge); }
  .split i { display:block; height:100%; transition:width .6s; } #sp-main { background:var(--accent); } #sp-sub { background:var(--main); }
  .splitlbl { display:flex; justify-content:space-between; gap:8px; margin-top:3px; font-size:10px; } .splitlbl b { color:var(--strong); margin-left:4px; }
  .note { margin:4px 0 0; font-size:9px; opacity:.55; line-height:1.3; }
  #log { list-style:none; margin:0; padding:0; overflow:auto; display:flex; flex-direction:column; gap:10px; font-size:15px; line-height:1.45; }
  #log li { border-left:4px solid var(--edge); padding-left:8px; }
  #log li.working { border-color:var(--accent); } #log li.done { border-color:var(--mint); } #log li.waiting { border-color:var(--main); } #log li.blocked { border-color:var(--alert); }
  #log time { color:var(--accent); margin-right:6px; font-size:13px; }
  #actp h2 { font-size:17px; }
  #actp { position:relative; align-self:stretch; min-height:260px; }   /* as tall as the office next to it; the list scrolls inside */
  #actp #log { position:absolute; left:14px; right:14px; top:48px; bottom:14px; }
  #err { display:none; margin:0 24px 12px; padding:10px 14px; background:var(--alert); color:var(--ink); font-weight:700; }
  #modal { display:none; position:fixed; inset:0; background:rgba(5,8,20,.78); align-items:center; justify-content:center; padding:24px; z-index:20; }
  #modal.on { display:flex; }
  #modal .box { max-width:720px; width:100%; background:var(--panel); color:var(--strong); border:6px solid var(--main); box-shadow:10px 10px 0 rgba(0,0,0,.5); padding:28px; }
  #modal h2 { margin:0 0 14px; color:var(--accent); letter-spacing:.08em; font-size:22px; }
  #modal p { margin:0 0 14px; font-size:20px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  #modal small { color:var(--soft); font-size:15px; }
  #modal .box { position:relative; }
  #mclose { position:absolute; top:10px; right:12px; width:36px; height:36px; font:inherit; font-size:18px; line-height:1; color:var(--strong); background:var(--inset); border:3px solid var(--edge); cursor:pointer; }
  #mclose:hover { border-color:var(--neon); }
  #modal .box.appr { border-color:var(--accent); } #modal .box.appr h2 { color:var(--accent); }
  .mopts { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 14px; }
  .mopts button.opt { cursor:pointer; font-family:inherit; }
  .mopts button.opt:hover, .mopts button.opt:focus-visible { border-color:#f90; outline:none; }
  .mopts .mfree { display:flex; gap:8px; width:100%; margin-top:10px; align-items:flex-end; }
  .mopts .mfree textarea { resize:vertical; max-height:40vh; line-height:1.4; }
  .mopts .mfree input, .mopts .mfree textarea { flex:1; min-width:0; background:var(--inset); color:var(--strong); border:3px solid var(--edge); font:inherit; font-size:16px; padding:8px 10px; }
  .mopts .opt { background:var(--inset); color:var(--strong); border:3px solid var(--edge); font-size:17px; padding:8px 18px; }
  .mopts button { background:var(--inset); color:var(--strong); border:3px solid var(--edge); font:inherit; font-size:17px; padding:8px 18px; cursor:pointer; }
  .mopts button:hover { border-color:var(--neon); }
  .mhint { margin:0 0 12px !important; font-size:16px !important; color:var(--soft); }
  @media (prefers-reduced-motion: reduce) { .chip i, .mem .dot { animation:none !important; } }
#tabbar{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#0003}
#tabbar.empty{display:none}
#tabs{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
#tabs button{flex:0 0 auto;white-space:nowrap;font:inherit;cursor:pointer;padding:4px 10px;border:1px solid #fff4;border-radius:6px;background:#0004;color:inherit}
#tsearch,#tfilter{flex:0 0 auto;font:inherit;font-size:13px;padding:4px 8px;background:#0004;color:inherit;border:1px solid #fff4;border-radius:6px}
#tsearch{width:150px} #tfilter option{color:#111}
#tcount{flex:0 0 auto;font-size:12px;opacity:.75;white-space:nowrap}
#tabs button.sel{background:#fff3;border-color:var(--strong);font-weight:bold}
#tabs button.ask{border-color:#f90;animation:tb 1s infinite}
#tabs button small{opacity:.7;margin-left:4px}
#tabs button .x{margin-left:6px;padding:0 5px;border-radius:4px;opacity:.6;font-weight:bold}
#tabs button .x:hover{opacity:1;background:#f446;color:#fff}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:3px;margin-left:6px;color:#0B1022;background:#8A93BD;vertical-align:middle}
.tag.working{background:#3DDC84} .tag.waiting{background:var(--main)} .tag.done{background:var(--mint)} .tag.blocked{background:var(--alert)}
.tag.working,.tag.waiting{animation:blink 1.2s steps(2) infinite}
@keyframes tb{50%{background:#f904}}

:root[data-theme=light] { --strong:#111A3F; --bg:#EEF2FA; --panel:#FFFFFF; --edge:#9AA7D0; --soft:#2A3358; --inset:#EAF0FB; --deep:#CBD5EA; --neon:#1769D1; --accent:#B77900; --main:#D6336C; --mint:#1E9E5A; --alert:#D33B3B; }
:root[data-theme=light] h1 { text-shadow:none; } :root[data-theme=light] .panel, :root[data-theme=light] #stagewrap { box-shadow:4px 4px 0 rgba(30,40,90,.15); }
:root[data-theme=light] .tile b, :root[data-theme=light] .urow b, :root[data-theme=light] .mem .who b, :root[data-theme=light] .splitlbl b, :root[data-theme=light] .szl b { color:#111A3F; }
:root[data-theme=light] #log time, :root[data-theme=light] .meta b { color:#B77900; }
:root[data-theme=green] { --bg:#04100A; --panel:#08200F; --edge:#1E7A3C; --soft:#BDF5CC; --inset:#06180C; --deep:#020A05; --neon:#3DFF8A; --accent:#E6FF5C; --main:#FF7AB6; --mint:#9BE3B5; --alert:#FF8A80; }
:root[data-theme=warm] { --bg:#1B1410; --panel:#2A1F18; --edge:#7A5A3A; --soft:#F0DFC8; --inset:#20170F; --deep:#120D09; --neon:#FFB454; --accent:#FFD23F; --main:#F25C9C; --mint:#9BE3B5; --alert:#FF8A80; }
:root[data-theme=light] #modal { background:rgba(30,40,90,.45); } :root[data-theme=light] #modal .box h2 { color:#9A6200; }
:root[data-theme=princess] { --strong:#4A2A6B; --bg:#FFE9F3; --panel:#FFF8FC; --edge:#E9A8D2; --soft:#6B3F8C; --inset:#FDE7F2; --deep:#F6D3EA; --neon:#C2409A; --accent:#B8860B; --main:#E0559F; --mint:#3FA97F; --alert:#E04B6A; }
:root[data-theme=princess] body { background:linear-gradient(160deg,#FFE9F3 0%,#EBDDFB 55%,#FFF3D6 100%) fixed; }
:root[data-theme=princess] h1 { color:#C2409A; text-shadow:2px 2px 0 #F5C6E3, 0 0 14px rgba(255,200,230,.9); }
:root[data-theme=princess] .panel, :root[data-theme=princess] #stagewrap { border-color:#E9A8D2; border-radius:14px; box-shadow:0 4px 0 #F2C7E1, 0 8px 18px rgba(194,64,154,.15); }
:root[data-theme=princess] #team { border-color:#B993E8; box-shadow:0 4px 0 #DCCBF5, 0 8px 18px rgba(130,90,200,.15); }
:root[data-theme=princess] #stagewrap { overflow:hidden; }
:root[data-theme=princess] .mem, :root[data-theme=princess] .tile, :root[data-theme=princess] #links a { border-radius:8px; }
:root[data-theme=princess] #log time, :root[data-theme=princess] .meta b { color:#B8860B; }
:root[data-theme=princess] #tabbar { background:#F7D7EA; }
:root[data-theme=princess] #modal { background:rgba(120,60,140,.4); } :root[data-theme=princess] #modal .box h2 { color:#B8860B; }
:root[data-theme=princess] .zbtn { border-radius:10px; }
</style>
</head>
<body>
<header>
  <h1>Ninas Agent (ETM)</h1>
  <div class="tools">
    <button id="zbtn" class="zbtn" type="button"></button>
    <label class="zbtn thl">🎨 ธีม <select id="thsel"></select></label>
    <button id="mbtn" class="zbtn" type="button" aria-pressed="false">🎵 เพลง: ปิด</button>
  </div>
  <div class="meta"><span>CARD <b id="ticket">-</b><span class="tag" id="jtag">IDLE</span></span><span>TIME <b id="clock">00:00</b></span><span>ONLINE <b id="online">0</b>/8</span></div>
</header>
<div id="tabbar" class="empty">
  <input id="tsearch" type="search" placeholder="ค้นหาการ์ด" aria-label="ค้นหาการ์ด">
  <select id="tfilter" aria-label="กรองตามสถานะ"><option value="all">ทุกสถานะ</option><option value="ask">รอคำตอบ</option><option value="working">กำลังทำ</option><option value="waiting">รอ</option><option value="done">เสร็จ</option><option value="idle">ว่าง</option><option value="blocked">ติดขัด</option></select>
  <span id="tcount"></span>
  <div id="tabs"></div>
</div>
<div id="err">เชื่อมต่อบอร์ดไม่ได้ ลองรัน: node .claude/team/team.mjs open</div>
<main>
  <div class="mid">
    <aside class="panel" id="team"><h2>TEAM STATUS</h2><div id="roster"></div></aside>
    <aside class="panel" id="linkp"><h2>LINKS</h2><div id="links"></div></aside>
  </div>
  <section id="stagewrap" aria-label="Team office">
    <div id="stage"><canvas id="cv"></canvas><div id="wallcard">CARD -</div></div>
  </section>
  <aside class="panel" id="actp"><h2>ACTIVITY</h2><ul id="log" aria-live="polite"></ul></aside>
</main>
<div id="modal" role="alertdialog" aria-labelledby="mt" aria-modal="true">
  <div class="box" id="mbox"><button id="mclose" type="button" aria-label="ปิด" title="ปิด (ถามอีกครั้งเมื่อมีคำถามใหม่)">✕</button><h2 id="mt">WAITING FOR YOU</h2><p id="mx"></p><div id="mo" class="mopts"></div><p id="mh" class="mhint"></p><small>ป๊อปอัปนี้จะปิดเองเมื่อคุณตอบ (ที่นี่หรือในแชท)</small></div>
</div>
<script>
// Pixel art by Pixel Agents (MIT, see assets/LICENSE-pixel-agents.txt). Sheet rows: 0 front, 1 back, 2 side. Frames: 0-2 walk, 3-4 type, 5-6 read.
const W = 384, H = 312;
const TEAM = [
  { id:'lead',      name:'LEAD',      job:'Sends the work out',     ch:1, hue:0 },
  { id:'analyst',   name:'ANALYST',   job:'Reads Jira and the AC',  ch:0, hue:0 },
  { id:'inspector', name:'INSPECTOR', job:'Checks the UI design',   ch:2, hue:0 },
  { id:'designer',  name:'DESIGNER',  job:'Writes test cases',      ch:3, hue:0 },
  { id:'reviewer',  name:'REVIEWER',  job:'Checks every case',      ch:4, hue:0 },
  { id:'automator', name:'AUTOMATOR', job:'Playwright scripts',     ch:5, hue:0 },
  { id:'reporter',  name:'REPORTER',  job:'Builds the evidence',    ch:0, hue:-35 },

let LGOPEN = {}; try { LGOPEN = JSON.parse(localStorage.getItem('ninas-link-groups') || '{}'); } catch {}
function renderLinks(list) {
  const key = JSON.stringify(list || []); if (key === linksKey) return; linksKey = key;
  el('links').innerHTML = LGROUPS.map(([id, title, test, none]) => {
    const items = (list || []).filter(test);
    return '<details data-g="' + id + '"' + (LGOPEN[id] === false ? '' : ' open') + '><summary>' + title + ' <b>' + items.length + '</b></summary><ul>' +
      (items.length ? items.map(l => '<li><a class="' + esc(l.kind) + '" href="' + esc(l.href) + '" target="_blank" rel="noopener noreferrer">' + (LK[l.kind] || LK.other) + ' ' + esc(l.label) + '</a></li>').join('') : '<li class="none">' + none + '</li>') + '</ul></details>';
  }).join('');
}
el('links').addEventListener('toggle', (e) => { const g = e.target.dataset && e.target.dataset.g; if (!g) return; LGOPEN[g] = e.target.open; try { localStorage.setItem('ninas-link-groups', JSON.stringify(LGOPEN)); } catch {} }, true);
el('tsearch').addEventListener('input', () => { tabQ = el('tsearch').value; if (last) renderTabs(last); });
el('tfilter').addEventListener('change', () => { tabF = el('tfilter').value; if (last) renderTabs(last); });
el('mclose').addEventListener('click', () => { if (last && last.ask) dismissed = last.ask.at; el('modal').classList.remove('on'); });
addEventListener('keydown', e => { if (e.key === 'Escape' && el('modal').classList.contains('on')) el('mclose').click(); });
function tick() {
  if (!last) return;
  const sec = Math.max(0, Math.floor((Date.now() - last.startedAt) / 1000));
  el('clock').textContent = pad(Math.floor(sec/60)) + ':' + pad(sec%60);
  for (const a of TEAM) {
    if (a.state !== 'working') continue;
    const e = Math.max(0, Math.floor((Date.now() - (a.since || Date.now())) / 1000));
    el('pt-' + a.id).textContent = (a.pct != null ? a.pct + '% · ' : '') + pad(Math.floor(e / 60)) + ':' + pad(e % 60);
  }
}
async function poll() {
  try { const r = await fetch('/state' + (curJob ? '?job=' + encodeURIComponent(curJob) : ''), { cache:'no-store' }); render(await r.json()); el('err').style.display = 'none'; }
  catch { el('err').style.display = 'block'; }
}

// ---- boot ----
(async () => {
  const jobs = [loadImg('floor', 'assets/floors/floor_3.png'), loadImg('floorBlue', 'assets/floors/floor_0.png'), loadImg('floorChk', 'assets/floors/floor_8.png')];
  for (let i = 0; i < 6; i++) jobs.push(loadImg('ch' + i, 'assets/characters/char_' + i + '.png'));
  for (const f of FURN) jobs.push(loadImg(f.split('/')[1], 'assets/furniture/' + f + '.png'));
  await Promise.all(jobs);
  TEAM.forEach((a, i) => { sheets[i] = bake(i); });
  bg = buildBackground();
  buildPanels(); buildOverlay(); layout();
  TEAM.forEach(a => { for (const h of [lbl[a.id], el('rn-' + a.id)]) { h.title = 'คลิกเพื่อเปลี่ยนชื่อ'; h.addEventListener('click', () => { if (!h.querySelector('input')) editName(a, h); }); } });
  applyNames();
  const zlabel = () => { el('zbtn').textContent = '🧟 ซอมบี้: ' + (ZOMBIE ? 'เปิด' : 'ปิด'); };
  zlabel();
  el('zbtn').addEventListener('click', () => {
    ZOMBIE = !ZOMBIE; try { localStorage.setItem('ninas-zombie', ZOMBIE ? '1' : '0'); } catch {}
    TEAM.forEach((a, i) => { sheets[i] = bake(i); avatar(el('av-' + a.id), i); }); zlabel();
  });
  window.addEventListener('resize', layout);
  { const TH = ['dark', 'light', 'green', 'warm', 'princess'], NM = { dark:'มืด', light:'สว่าง', green:'เขียว', warm:'อุ่น', princess:'เจ้าหญิง 👑' }; let t = 'dark'; try { t = localStorage.getItem('ninas-theme') || 'dark'; } catch {}
    if (!TH.includes(t)) t = 'dark';
    const sel = el('thsel'); sel.innerHTML = TH.map(k => '<option value="' + k + '">' + NM[k] + '</option>').join('');
    const ap = () => { document.documentElement.setAttribute('data-theme', t); sel.value = t; try { localStorage.setItem('ninas-theme', t); } catch {} };
    sel.addEventListener('change', () => { t = sel.value; ap(); }); ap(); }

  let lastT = performance.now();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function loop(now) {
    const dt = Math.min(0.25, (now - lastT) / 1000); lastT = now;
    step(dt); schedule(now); draw(reduce ? 0 : now / 1000); placeOverlay(now);
    requestAnimationFrame(loop);
  })(lastT);
  poll(); setInterval(poll, 1000); setInterval(tick, 1000);
})();
</script>
<script>
// Chiptune background music (WebAudio, no files). Browsers need one click to start sound.
(() => {
  const btn = document.getElementById('mbtn');
  const BPM = 132, STEP = 60 / BPM / 2; // eighth notes
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  // 32 eighth-note steps (4 bars), C major pentatonic lead; null = rest
  const LEAD = [72,null,76,79,81,null,79,76, 74,null,77,81,84,null,81,77,
                72,null,76,79,84,null,81,79, 79,76,74,76,72,null,null,null];
  const BASS = [48,48,55,55, 53,53,57,57, 48,48,55,55, 55,55,52,52]; // per quarter note
  let ctx, master, timer, step = 0, nextT = 0, on = false;
  try { on = localStorage.getItem('ninas-music') === '1'; } catch {}

  function tone(type, freq, t, dur, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function hat(t) {
    const len = Math.floor(ctx.sampleRate * 0.04), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = b; g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    s.connect(g); g.connect(master); s.start(t);
  }
  function schedule() {
    while (nextT < ctx.currentTime + 0.25) {
      const i = step % LEAD.length, n = LEAD[i];
      if (n != null) tone('square', hz(n), nextT, STEP * 0.9, 0.07);
      if (i % 2 === 0) tone('triangle', hz(BASS[(i / 2) % BASS.length]), nextT, STEP * 1.8, 0.16);
      if (i % 2 === 1) hat(nextT);
      nextT += STEP; step++;
    }
  }
  function label() { btn.textContent = '🎵 เพลง: ' + (on ? 'เปิด' : 'ปิด'); btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  function start() {
    if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination); }
    ctx.resume(); nextT = ctx.currentTime + 0.05; clearInterval(timer); timer = setInterval(schedule, 80);
  }
  function stop() { clearInterval(timer); if (ctx) ctx.suspend(); }
  btn.addEventListener('click', () => {
    on = !on; try { localStorage.setItem('ninas-music', on ? '1' : '0'); } catch {}
    on ? start() : stop(); label();
  });
  // Autoplay is blocked: if it was on last time, start at the first click anywhere on the page.
  if (on) document.addEventListener('pointerdown', function once(e) { if (e.target !== btn) { start(); } document.removeEventListener('pointerdown', once); }, { once: true });
  label();
})();
</script>
